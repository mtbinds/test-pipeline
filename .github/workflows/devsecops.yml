name: TP22 DevSecOps Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tp22-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tp22-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r app/requirements.txt \
            -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q \
            --junitxml=outputs/pytest.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp22-tests
          path: outputs/pytest.xml
          retention-days: 14

  sast:
    name: SAST - Semgrep CE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep JSON
        uses: docker://semgrep/semgrep:latest
        with:
          args: >
            semgrep scan
            --config semgrep-rules.yml
            --json
            --output outputs/semgrep.json
            app/

      - name: Run Semgrep SARIF
        uses: docker://semgrep/semgrep:latest
        with:
          args: >
            semgrep scan
            --config semgrep-rules.yml
            --sarif
            --output outputs/semgrep.sarif
            app/

      - name: Evaluate SAST policy
        run: |
          python scripts/evaluate_sast.py \
            outputs/semgrep.json

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp22-sast
          path: |
            outputs/semgrep.json
            outputs/semgrep.sarif
          retention-days: 14

  build:
    name: Build container
    runs-on: ubuntu-latest
    needs:
      - tests
      - sast

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            app/

      - name: Save image
        run: |
          docker save \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o outputs/tp22-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp22-image
          path: outputs/tp22-image.tar
          retention-days: 1

  container_scan:
    name: Container scan - Trivy
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: tp22-image
          path: outputs/

      - name: Load image
        run: |
          docker load \
            -i outputs/tp22-image.tar

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: outputs/trivy.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Evaluate container policy
        run: |
          python scripts/evaluate_trivy.py \
            outputs/trivy.json

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp22-container-scan
          path: outputs/trivy.json
          retention-days: 14

  dast:
    name: DAST - ZAP Baseline
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: tp22-image
          path: outputs/

      - name: Load image
        run: |
          docker load \
            -i outputs/tp22-image.tar

      - name: Create network
        run: |
          docker network create tp22-ci

      - name: Start application
        run: |
          docker run \
            -d \
            --name tp22-ci-app \
            --network tp22-ci \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Health check
        run: |
          for attempt in $(seq 1 30); do
            if docker run \
              --rm \
              --network tp22-ci \
              curlimages/curl:8.16.0 \
              -fsS \
              http://tp22-ci-app:8080/health
            then
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: ZAP Baseline
        id: zap
        continue-on-error: true
        run: |
          mkdir -p outputs
          chmod 777 outputs
          
          set +e
         
          docker run \
            --rm \
            --network tp22-ci \
            -v "${PWD}/outputs:/zap/wrk:rw" \
            -v "${PWD}/zap-baseline.conf:/zap/wrk/zap-baseline.conf:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://tp22-ci-app:8080 \
            -c /zap/wrk/zap-baseline.conf \
            -J zap.json \
            -r zap.html \
            -w zap.md

          ZAP_EXIT=$?
          echo "exit_code=$ZAP_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== outputs ==="
          ls -lah outputs || true

          set -e 

      - name: Evaluate ZAP policy
        run: |
          python scripts/evaluate_zap.py \
            outputs/zap.json \
            "${{ steps.zap.outputs.exit_code }}"

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp22-dast
          path: |
            outputs/zap.json
            outputs/zap.html
            outputs/zap.md
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          docker rm \
            -f tp22-ci-app \
            || true

          docker network rm \
            tp22-ci \
            || true

  gate:
    name: Final security gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tests
      - sast
      - build
      - container_scan
      - dast

    steps:
      - name: Decide
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTAINER_RESULT: ${{ needs.container_scan.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          printf '%s\n' \
            "tests=$TESTS_RESULT" \
            "sast=$SAST_RESULT" \
            "build=$BUILD_RESULT" \
            "container=$CONTAINER_RESULT" \
            "dast=$DAST_RESULT"

          for value in \
            "$TESTS_RESULT" \
            "$SAST_RESULT" \
            "$BUILD_RESULT" \
            "$CONTAINER_RESULT" \
            "$DAST_RESULT"
          do
            if [ "$value" != "success" ]; then
              echo "BLOCK"
              exit 1
            fi
          done

          echo "PASS"
